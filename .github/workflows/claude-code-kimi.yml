name: Claude Code (Kimi) [manual]

# PR 评论 /claude 已合并到 cursor-pr-comment.yml（PR Agent Comment workflow）。
# 本文件仅保留手动 workflow_dispatch，用于调试或重跑指定 PR。

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR 编号
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER=${{ inputs.pr_number }}
          JSON=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json number,headRefName,headRefOid,isCrossRepository)
          CROSS=$(echo "$JSON" | jq -r '.isCrossRepository')
          if [ "$CROSS" = "true" ]; then
            echo "::error::/claude 不支持 fork 跨仓库 PR"
            exit 1
          fi
          echo "number=$(echo "$JSON" | jq -r '.number')" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$JSON" | jq -r '.headRefName')" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(echo "$JSON" | jq -r '.headRefOid')" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "claude[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Prepare PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ steps.pr.outputs.number }}" > /tmp/pr.diff || true

      - name: Run Claude Code with Kimi
        env:
          ANTHROPIC_BASE_URL: https://api.kimi.com/coding
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MOONSHOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ANTHROPIC_MODEL: kimi-k2.5
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          API_TIMEOUT_MS: "600000"
        run: |
          claude -p "Manual rerun on PR #${{ steps.pr.outputs.number }}. Read /tmp/pr.diff and follow the latest /claude comment on the PR." \
            --bare --permission-mode acceptEdits --max-turns 40 2>&1 | tee /tmp/claude-agent-output.txt

      - name: Push fallback if Claude left uncommitted changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git add -A
          git commit -m "chore(claude): manual workflow_dispatch"
          git push origin HEAD

      - name: Comment result on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BASE_SHA="${{ steps.base.outputs.sha }}"
          AFTER_SHA=$(git rev-parse HEAD 2>/dev/null || echo "$BASE_SHA")
          if [ "${{ job.status }}" != "success" ]; then
            BODY="❌ Claude Code 手动重跑失败。见 [Actions run](${RUN_URL})。"
          elif [ "$BASE_SHA" != "$AFTER_SHA" ]; then
            BODY="✅ Claude Code 手动重跑已在 \`${{ steps.pr.outputs.head_ref }}\` 提交改动。"
          elif [ -f /tmp/claude-agent-output.txt ]; then
            BODY="✅ Claude Code 手动重跑完成（无新提交）。见 [Actions run](${RUN_URL})。"
          else
            BODY="✅ Claude Code 手动重跑结束。见 [Actions run](${RUN_URL})。"
          fi
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$BODY"
