name: Cursor Agent

# workflow_dispatch：audit=只读评审；implement=改代码并推分支
# PR 评论请用 cursor-pr-comment.yml（PR Agent Comment）
# Secrets: CURSOR_API_KEY

on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit=只读评审；implement=允许改代码并推分支
        required: false
        default: implement
        type: choice
        options:
          - audit
          - implement
      prompt:
        description: 交给 Cursor Agent 的任务说明
        required: true
        type: string
      model:
        description: Cursor 模型 id
        required: false
        default: auto
      create_pr:
        description: （仅 implement）验证后是否自动开 PR
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cursor-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor Agent (audit — read only)
        if: inputs.mode == 'audit'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          agent -p "$(cat <<'AGENT_EOF'
          IMPORTANT — 只读评审模式（必须遵守）：
          - 禁止创建、修改、删除任何文件。
          - 禁止 git、gh、commit、push、开 PR。
          - 只允许阅读、搜索、分析；所有结论必须写在 stdout（Markdown 结构：概要 / 风险 / 建议）。
          - 若任务要求改代码，说明「请用 mode=implement 重新 dispatch」后停止。

          任务：
          ${{ inputs.prompt }}
          AGENT_EOF
          )" --model "${{ inputs.model }}" --trust 2>&1 | tee /tmp/cursor-agent-output.txt
          AGENT_EXIT=${PIPESTATUS[0]}
          exit "$AGENT_EXIT"

      - name: Publish audit report
        if: inputs.mode == 'audit' && always()
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f /tmp/cursor-agent-output.txt ] && grep -q '[^[:space:]]' /tmp/cursor-agent-output.txt; then
            {
              echo "## Cursor Agent 只读评审报告"
              echo ""
              echo "任务：${{ inputs.prompt }}"
              echo ""
              cat /tmp/cursor-agent-output.txt
              echo ""
              echo "---"
              echo "完整日志：[Actions run](${RUN_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "audit 完成，但未捕获到 Agent 文本输出。见 ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Cursor Agent (implement)
        if: inputs.mode == 'implement'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          agent -p "$(cat <<'AGENT_EOF'
          IMPORTANT — CI 约束：
          - 不要执行 git、gh、commit、push、开 PR；只修改工作区文件。
          - 不要改 .github/workflows、.env 或密钥文件。

          任务：
          ${{ inputs.prompt }}
          AGENT_EOF
          )" --model "${{ inputs.model }}" --trust 2>&1 | tee /tmp/cursor-agent-output.txt

      - name: Detect changes
        id: changes
        if: inputs.mode == 'implement'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --name-only
          fi

      - name: Commit agent changes
        if: inputs.mode == 'implement' && steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="cursor/agent-${{ github.run_id }}"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(agent): cursor workflow task"
          git push -u origin "$branch"
          if [ "${{ inputs.create_pr }}" = "true" ]; then
            gh pr create --title "chore(agent): cursor workflow task" --body "由 Cursor Agent workflow 生成。"
          fi

      - name: Implement complete notice
        if: inputs.mode == 'implement' && steps.changes.outputs.has_changes != 'true'
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f /tmp/cursor-agent-output.txt ] && grep -q '[^[:space:]]' /tmp/cursor-agent-output.txt; then
            {
              echo "## Cursor Agent 完成（无文件改动）"
              echo ""
              cat /tmp/cursor-agent-output.txt
              echo ""
              echo "---"
              echo "[Actions run](${RUN_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Agent 未产生文件改动。见 ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi
